<!DOCTYPE html>
<html>
    <body>

    </body>
    <script>

        function odota(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        function laskeSumma(a, b) {
            return a + b;
        }

        async function Tulo(a, b) {
            await odota(1000);
            return a * b;
        }

        async function main() {
            document.write(laskeSumma(1, 3));

            const tulos = await Tulo(1, 3);
            document.write(tulos);
        }

        main();
    </script>
</html>
