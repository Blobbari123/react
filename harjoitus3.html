<!DOCTYPE html>
<html>
    <body>
        <p id="print"></p>
    </body>
    <script>
        const auto = [
        { merkki: "Toyota",malli:"Corolla", vuosi:2021 },
        { merkki: "Honda",malli:"Civic", vuosi:2018 },
        { merkki: "BMW",malli:"M3", vuosi:2021 },
    ];
        document.getElementById("print").textContent =
        auto.map(a => `${a.merkki} ${a.malli} ${a.vuosi}`).join("\n");
        
        
        function laskeYhteensa(...luvut) {
        return luvut.reduce((summa, luku) => summa + luku, 0);

        console.log(laskeYhteensa(1,3,54,6));
}
    

    </script>
    <style>
        #print {
            color: black;
        }
    </style>
</html>
